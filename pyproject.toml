[project]
name = "bem-estar-extractor"
version = "0.1.0"
description = "Extrator experimental de metadados de relatos sintéticos em português"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ollama>=0.6,<1",
    "pydantic>=2.11,<3",
    "httpx>=0.28,<1",
    "prompt-toolkit>=3.0.50,<4",
    "vadersentiment>=3.3.2,<4",
    "mlflow>=3.18.0,<4",
    "scikit-learn>=1.9.1,<2",
    "matplotlib>=3.11,<4",
]

[project.scripts]
bem-estar = "app.shell:main"
bem-estar-route-evaluate = "evaluation.router:main"
bem-estar-extract = "agents.extractor.cli:main"
bem-estar-evaluate = "evaluation.runner:main"
bem-estar-mlops = "mlops.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "evaluation", "app", "mlops", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel.force-include]
"data/synthetic" = "data/synthetic"

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/agents",
    "/evaluation",
    "/mlops",
    "/models",
    "/data/synthetic",
    "/tests",
    "/docs",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.env.example",
]
